<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>MewClient</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-dark">

<div class="bg-overlay" id="bg-overlay"></div>

<header class="titlebar">
  <div class="logo">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none"><path d="M4 18V6l4 5 4-7 4 7 4-5v12" stroke="#5EC64D" stroke-width="2.4" stroke-linecap="round"/></svg>
    <span>MEW<b>CLIENT</b></span>
  </div>
  <div class="wc-group">
    <button id="btn-min" class="wc">—</button>
    <button id="btn-max" class="wc">□</button>
    <button id="btn-close" class="wc wc-close">✕</button>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <nav class="nav">
      <button class="nav-item active" data-page="home"><span>🏠 Главная</span></button>
      <button class="nav-item" data-page="mods"><span>📦 Мои моды</span></button>
      <button class="nav-item" data-page="store"><span>🛒 Магазин модов</span></button>
      <button class="nav-item" data-page="servers"><span>🌐 Сервера</span></button>
      <button class="nav-item" data-page="screenshots"><span>🖼 Скриншоты</span></button>
      <button class="nav-item" data-page="settings"><span>⚙️ Настройки</span></button>
      <button class="nav-item" data-page="console"><span>💻 Консоль</span></button>
    </nav>

    <div class="sidebar-bottom">
      <div class="online-badge">
        <span class="online-dot" id="online-dot"></span>
        <span id="online-count">0</span> <span id="online-text">людей в лаунчере</span>
      </div>
      <div class="account-card">
        <div class="acc-info">
          <div class="acc-name" id="side-nick">Steve</div>
          <div class="acc-status" id="side-status"><span class="dot"></span> Оффлайн</div>
        </div>
        <button id="btn-login-ely" class="btn-ghost" style="padding:6px; font-size:10px;">Войти</button>
      </div>
    </div>
  </aside>

  <main class="content">
    <!-- ГЛАВНАЯ -->
    <section id="page-home" class="page active">
      <div class="hero glass">
        <div class="hero-content">
          <div class="hero-badge">MewClient Launcher</div>
          <h1>Привет, <span class="grad" id="hero-nick">Steve</span>!</h1>
          
          <div class="quick-row" style="margin-top:20px;">
            <div class="field">
              <label>Активный профиль (Сборка)</label>
              <div class="row">
                <div class="select-wrap"><select id="home-profile"></select></div>
                <button id="btn-new-profile" class="btn-ghost" style="flex:0 0 auto;">+ Новый</button>
              </div>
            </div>
            <div class="field">
              <label>Версия</label>
              <div class="select-wrap"><select id="home-version"></select></div>
            </div>
            <div class="field">
              <label>Ядро</label>
              <div class="select-wrap">
                <select id="home-loader">
                  <option value="vanilla">Vanilla</option>
                  <option value="fabric">Fabric</option>
                  <option value="forge">Forge</option>
                </select>
              </div>
            </div>
          </div>

          <div class="play-row">
            <button id="btn-play" class="btn-play"><span class="btn-play-text">ИГРАТЬ</span></button>
          </div>
        </div>
      </div>
    </section>

    <!-- МОДЫ -->
    <section id="page-mods" class="page">
      <div class="page-head"><h2>Мои моды</h2><button class="btn-ghost glass" id="btn-mods-folder">Открыть папку</button></div>
      <div id="drop-zone" class="glass" style="padding: 30px; text-align: center; border: 2px dashed var(--m-border-strong); border-radius: 12px; margin-bottom: 20px;">
        <h3 style="color:var(--m-fg-subtle);">Перетащи сюда .jar файлы модов</h3>
      </div>
      <div class="mods-list" id="mods-list"></div>
    </section>

    <!-- МАГАЗИН -->
    <section id="page-store" class="page">
      <div class="page-head"><h2>Магазин Modrinth</h2></div>
      <div class="search-row">
        <input id="store-search" type="text" placeholder="Например: JEI, Sodium..." />
        <button id="btn-store-find" class="btn-primary">Найти</button>
      </div>
      <div class="versions-grid" id="store-grid"></div>
    </section>

    <!-- СЕРВЕРА -->
    <section id="page-servers" class="page">
      <div class="page-head"><h2>Мониторинг серверов</h2></div>
      <div class="row" style="margin-bottom:20px;">
        <input id="server-ip-input" type="text" placeholder="IP сервера (например, mc.hypixel.net)" />
        <button id="btn-add-server" class="btn-primary" style="flex:0 0 auto;">Добавить</button>
      </div>
      <div class="mods-list" id="servers-list"></div>
    </section>

    <!-- СКРИНШОТЫ -->
    <section id="page-screenshots" class="page">
      <div class="page-head"><h2>Скриншоты</h2><button class="btn-ghost glass" id="btn-refresh-shots">Обновить</button></div>
      <div class="versions-grid" id="screenshots-grid"></div>
    </section>

    <!-- НАСТРОЙКИ -->
    <section id="page-settings" class="page">
      <div class="page-head"><h2>Настройки</h2></div>
      <div class="settings-grid">
        <div class="card glass">
          <h3>Внешний вид</h3>
          <div class="field">
            <label>Тема</label>
            <div class="select-wrap"><select id="set-theme"><option value="dark">Тёмная</option><option value="light">Светлая</option></select></div>
          </div>
          <div class="field" style="margin-top:15px;">
            <label>Фоновое изображение</label>
            <div class="row">
              <button class="btn-ghost" id="btn-pick-bg" style="width:100%;">Выбрать картинку</button>
            </div>
          </div>
        </div>

        <div class="card glass">
          <h3>Производительность</h3>
          <div class="field">
            <label>ОЗУ: <b id="ram-val">6144 МБ</b></label>
            <input id="set-ram" type="range" min="1024" max="16384" step="512" value="6144" />
          </div>
          <div class="field">
            <label>Путь к Java</label>
            <div class="row"><input id="set-java" type="text" placeholder="Автоопределение" /><button class="btn-ghost" id="btn-pick-java">Обзор</button></div>
          </div>
        </div>

        <div class="card glass">
          <h3>Папка игры</h3>
          <div class="field">
            <label>Корневая директория</label>
            <div class="row"><input id="set-dir" type="text" /><button class="btn-ghost" id="btn-pick-dir">Обзор</button></div>
          </div>
        </div>
      </div>
      <button id="btn-save" class="btn-primary" style="margin-top:20px;">Сохранить настройки</button>
    </section>

    <!-- КОНСОЛЬ -->
    <section id="page-console" class="page">
      <div class="page-head"><h2>Консоль</h2><button class="btn-ghost glass" id="btn-clear-log">Очистить</button></div>
      <div class="console glass" id="console"></div>
    </section>
  </main>
</div>

<script src="renderer.js"></script>
</body>
</html>
